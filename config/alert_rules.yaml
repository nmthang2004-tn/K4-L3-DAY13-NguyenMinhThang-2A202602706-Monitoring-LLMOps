alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate(request_failed/request_received) > 2%
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessDegraded
    severity: warning
    condition: retrieval_success_rate(tool_success) < 90%
    duration: 10m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student
    runbook: docs/alerts.md#alert-3
